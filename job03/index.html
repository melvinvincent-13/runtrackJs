<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Job 03 — Jeu du Taquin</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 30px;
        background: #f0f4ff;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 { color: #1919e6; margin-bottom: 6px; }
      p.intro { color: #555; margin-bottom: 20px; font-size: 14px; }

      /* ─── Grille 3×3 du taquin ──────────────────────────────────────── */
      #grille {
        display: grid;
        grid-template-columns: repeat(3, 120px);
        grid-template-rows:    repeat(3, 120px);
        gap: 4px;
        background: #1919e6;
        border: 4px solid #1919e6;
        border-radius: 8px;
        margin-bottom: 24px;
      }

      /*  Chaque carreau  */
      .carreau {
        width: 120px;
        height: 120px;
        cursor: pointer;
        overflow: hidden;
        transition: opacity 0.15s;
      }
      .carreau:hover { opacity: 0.85; }
      .carreau img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none; /* le clic va sur .carreau, pas sur l'img */
      }

      /*  Case vide  */
      .case-vide {
        background: #fff;
        cursor: default;
      }
      .case-vide:hover { opacity: 1; }

      /*  Message victoire  */
      #message {
        font-size: 26px;
        font-weight: bold;
        color: green;
        min-height: 40px;
        margin-bottom: 14px;
      }

      /*  Bouton Recommencer  */
      #btn-recommencer {
        display: none; /* masqué jusqu'à la victoire */
        padding: 12px 28px;
        background: #1919e6;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
      }
      #btn-recommencer:hover { background: #0d0da0; }

      /*  Compteur de mouvements  */
      #compteur { font-size: 14px; color: #555; margin-bottom: 14px; }
    </style>
  </head>
  <body>
    <h1>Jeu du Taquin</h1>
    <p class="intro">Cliquez sur un carreau adjacent à la case vide pour le déplacer.<br>Remettez l'image dans l'ordre !</p>

    <!-- Compteur de mouvements -->
    <div id="compteur">Mouvements : 0</div>

    <!-- Grille 3×3 — peuplée dynamiquement par script.js -->
    <div id="grille"></div>

    <!-- Message victoire -->
    <div id="message"></div>

    <!-- Bouton Recommencer — apparaît après victoire -->
    <button id="btn-recommencer">🔄 Recommencer</button>
  </body>
</html>
